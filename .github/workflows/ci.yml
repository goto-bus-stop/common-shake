name: CI

on: [push, pull_request]

jobs:
  test:
    name: Run tests
    strategy:
      matrix:
        include:
          - node_version: '4.x'
          - node_version: '6.x'
          - node_version: '8.x'
          - node_version: '10.x'
          - node_version: '12.x'
          - node_version: '14.x'
          - node_version: '16.x'
          - node_version: '18.x'
            coverage: true
          - node_version: '20.x'
            coverage: true
          - node_version: '22.x'
            coverage: true
          - node_version: '24.x'
            coverage: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Node.js ${{matrix.node-version}}
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node-version}}
      - name: Install dependencies
        run: npm install
      - name: Run tests (no coverage)
        if: ${{ !matrix.coverage }}
        run: npm run test:no-cov
      - name: Run tests
        if: ${{ matrix.coverage }}
        run: npm run test:cov

  lint:
    name: Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
            node-version: lts/*
      - name: Install dependencies
        run: npm install
      - name: Check style
        run: npm run lint
